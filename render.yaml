services:
  - type: web
    name: hotel-kaveri
    runtime: python
    plan: free
    buildCommand: npm install && npm run build && pip install -r requirements.txt && python seed_auth.py
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hotel-kaveri-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_MINUTES
        value: 15
      - key: REFRESH_TOKEN_DAYS
        value: 7
      - key: OWNER_EMAIL
        value: owner@example.com
      - key: OWNER_PASSWORD
        value: OwnerPass123
      - key: MANAGER_EMAIL
        value: manager@example.com
      - key: MANAGER_PASSWORD
        value: ManagerPass123
      - key: MANAGER_PROPERTY_ID
        value: 2
      - key: STAFF_EMAIL
        value: reception@example.com
      - key: STAFF_PASSWORD
        value: ReceptionPass123
      - key: STAFF_PROPERTY_ID
        value: 1

databases:
  - name: hotel-kaveri-db
    databaseName: kaveri
    user: postgres
    plan: free
