services:
  - type: web
    name: hotel-kaveri
    runtime: python
    plan: free
    buildCommand: npm install && npm run build && pip install -r requirements.txt && python seed_auth.py
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.18.0
      - key: DATABASE_URL
        fromDatabase:
          name: hotel-kaveri-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_MINUTES
        value: 15
      - key: REFRESH_TOKEN_DAYS
        value: 7
      - key: OWNER_EMAIL
        value: owner@example.com
      - key: OWNER_PASSWORD
        value: OwnerPass123
      # Property 1: Coorg
      - key: MANAGER_COORG_EMAIL
        value: manager_coorg@example.com
      - key: MANAGER_COORG_PASSWORD
        value: ManagerPass123
      - key: STAFF_COORG_EMAIL
        value: reception_coorg@example.com
      - key: STAFF_COORG_PASSWORD
        value: ReceptionPass123
      # Property 2: Ooty
      - key: MANAGER_OOTY_EMAIL
        value: manager_ooty@example.com
      - key: MANAGER_OOTY_PASSWORD
        value: ManagerPass123
      - key: STAFF_OOTY_EMAIL
        value: reception_ooty@example.com
      - key: STAFF_OOTY_PASSWORD
        value: ReceptionPass123
      # Property 3: Alleppey
      - key: MANAGER_ALLEPPEY_EMAIL
        value: manager_alleppey@example.com
      - key: MANAGER_ALLEPPEY_PASSWORD
        value: ManagerPass123
      - key: STAFF_ALLEPPEY_EMAIL
        value: reception_alleppey@example.com
      - key: STAFF_ALLEPPEY_PASSWORD
        value: ReceptionPass123

databases:
  - name: hotel-kaveri-db
    databaseName: kaveri
    user: postgres
    plan: free
